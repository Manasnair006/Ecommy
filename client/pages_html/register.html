<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ECOMMY</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-brand">
        <a href="index.html" style="color:white; font-size:1.6rem; font-weight:800;">ECOMMY</a>
      </div>
      <a href="login.html" class="nav-action-btn">Already have an account? Login</a>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="container">
      
      <div class="auth-card">
        <div class="auth-header">
          <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-main);">Create Your Account</h1>
          <p style="font-size:0.9rem; color:var(--text-muted); margin-top:4px;">Join Ecommy for exclusive deals and order tracking</p>
        </div>

        <form action="profile.html">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" placeholder="John Doe" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" placeholder="name@example.com" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" placeholder="Minimum 8 characters" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" placeholder="Repeat password" class="form-control" required>
          </div>

          <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
            <input type="checkbox" id="terms" required>
            <label for="terms" style="font-size:0.85rem; color:var(--text-muted);">I agree to the <a href="#" style="color:var(--primary-color);">Terms of Service</a> & <a href="#" style="color:var(--primary-color);">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create Ecommy Account</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
          Already registered? <a href="login.html" style="color:var(--primary-color); font-weight:600;">Sign in here</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      &copy; 2026 ECOMMY Inc. All rights reserved.
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
