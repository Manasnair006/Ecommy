<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ECOMMY</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="container navbar-inner">
      <div class="nav-brand">
        <a href="index.html" style="color:white; font-size:1.6rem; font-weight:800;">ECOMMY</a>
      </div>
      <a href="register.html" class="nav-action-btn">Sign Up Free →</a>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="container">
      
      <div class="auth-card">
        <div class="auth-header">
          <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-main);">Welcome Back</h1>
          <p style="font-size:0.9rem; color:var(--text-muted); margin-top:4px;">Sign in to manage your orders & profile</p>
        </div>

        <form action="profile.html">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" placeholder="name@example.com" class="form-control" required>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label class="form-label" style="margin-bottom:0;">Password</label>
              <a href="#" style="font-size:0.8rem; color:var(--primary-color);">Forgot?</a>
            </div>
            <input type="password" placeholder="••••••••" class="form-control" required>
          </div>

          <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
            <input type="checkbox" id="remember">
            <label for="remember" style="font-size:0.85rem; color:var(--text-muted);">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to Account</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
          Don't have an account? <a href="register.html" style="color:var(--primary-color); font-weight:600;">Create one here</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      &copy; 2026 ECOMMY Inc. All rights reserved.
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
